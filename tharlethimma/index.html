<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharle Thimma Podcast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Removed inline style for search-input-container -->
</head>
<body class="antialiased">
    <!-- Navbar -->
    <nav class="bg-transparent py-4 px-6 md:px-12 lg:px-24 flex justify-between items-center relative z-10">
        <div class="text-2xl font-bold text-white">Tharle Thimma</div>
        <!-- Desktop Navigation Links -->
        <div class="hidden md:flex space-x-8 items-center">
            <a href="#home" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link">Home</a>
            <a href="#profile" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link">My Profile</a>
            <a href="#audio-platforms" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link">Listen Here</a>
            <a href="#contact" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link">Contact</a>
        </div>
        <!-- Mobile Menu Toggle (Search icon and input removed) -->
        <div class="flex items-center space-x-4">
            <!-- Search Icon and its button and input have been removed -->
            <button id="mobile-menu-button" class="md:hidden text-gray-300 hover:text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>
    </nav>

    <!-- Mobile Menu (Hidden by default) -->
    <div id="mobile-menu" class="hidden md:hidden bg-[#24243e] py-4 px-6 fixed top-0 left-0 w-full h-full overflow-y-auto z-20 transition-transform duration-300 ease-in-out transform -translate-x-full">
        <div class="flex justify-between items-center mb-6">
            <div class="text-2xl font-bold text-white">Menu</div>
            <button id="close-mobile-menu" class="text-gray-300 hover:text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="flex flex-col space-y-4">
            <a href="#home" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link text-lg py-2" data-mobile-link>Home</a>
            <a href="#profile" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link text-lg py-2" data-mobile-link>My Profile</a>
            <a href="#audio-platforms" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link text-lg py-2" data-mobile-link>Listen Here</a>
            <a href="#contact" class="text-gray-300 hover:text-white transition-colors duration-300 nav-link text-lg py-2" data-mobile-link>Contact</a>
        </div>
    </div>


    <!-- Main Content Area -->
    <main id="app-content" class="container mx-auto mt-8">
        <!-- Content will be loaded dynamically by JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="bg-[#1a1a2e] py-10 mt-12 text-center text-gray-500 text-sm">
        <p>&copy; 2025 Tharle Thimma Podcast. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
